name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest and jq
        run: |
          python -m pip install --quiet pytest
          sudo apt-get install -y jq
      - name: Smoke tests
        run: bash skills/sync-me/tests/smoke.sh
      - name: Release metadata guard
        run: python -m pytest tests -q
